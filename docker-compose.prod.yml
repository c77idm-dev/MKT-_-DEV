# Produção na VPS compartilhada. O HTTPS fica com o nginx que já atende os outros sites do servidor
# (veja docs/operacao/deploy-vps.md). Este projeto só escuta em 127.0.0.1:3020.
# A imagem é compilada pelo GitHub Actions (.github/workflows/imagem.yml); a VPS só baixa.
name: devolucoes

services:
  web:
    image: ghcr.io/c77idm-dev/devolucoes:${IMAGEM_TAG:-main}
    restart: unless-stopped
    env_file: .env.producao
    # Mídia: o web recebe os uploads (tus) e o worker processa. Os dois enxergam o mesmo /data.
    volumes:
      - midia:/data
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    # Mesma imagem do web, outro ponto de entrada. Não migra o banco: quem migra é o web, na subida.
    image: ghcr.io/c77idm-dev/devolucoes:${IMAGEM_TAG:-main}
    restart: unless-stopped
    env_file: .env.producao
    # Mídia: o web recebe os uploads (tus) e o worker processa. Os dois enxergam o mesmo /data.
    volumes:
      - midia:/data
    command: ["node", "dist/worker.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    # Dá tempo à tarefa em andamento de terminar (o worker para com graceful).
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devolucoes
      POSTGRES_USER: devolucoes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devolucoes -d devolucoes"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  midia:
