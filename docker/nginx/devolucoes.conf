# Bloco do nginx da VPS para o sistema de devoluções.
# Antes de usar, troque DOMINIO_DO_SISTEMA pelo domínio real (veja docs/operacao/deploy-vps.md).
# O certbot acrescenta a parte HTTPS (porta 443) e o redirecionamento automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_DO_SISTEMA;

    # Planilhas de até 5 MB (Fase 1) mais a folga do envio.
    client_max_body_size 6m;

    # Avisos do Mercado Livre: corpo pequeno (spec §7.2); o sistema também recusa acima de 64 KB.
    location = /api/ml/notificacoes {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
